<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minimalist Gameplay Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            terracotta: '#9E472A',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #9E472A;
      color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
  </style>
</head>
<body class="bg-[#9E472A] text-white min-h-screen flex flex-col justify-between overflow-hidden relative">

  <!-- Top Navigation & Story Progress -->
  <header class="pt-6 px-5 z-20 space-y-4">
    <!-- Segmented White Progress Bar (Instagram Stories style) -->
    <div class="flex items-center gap-1.5 w-full">
      <div class="h-1 flex-1 bg-white rounded-full"></div>
      <div class="h-1 flex-1 bg-white rounded-full"></div>
      <div class="h-1 flex-1 bg-white rounded-full"></div>
      <div class="h-1 flex-1 bg-white/30 rounded-full"></div>
      <div class="h-1 flex-1 bg-white/30 rounded-full"></div>
    </div>

    <!-- Header bar with Deck name and close -->
    <div class="flex items-center justify-between pt-1">
      <div class="flex items-center gap-2">
        <span class="text-[11px] font-semibold tracking-wider uppercase text-white/80">Deep Conversations</span>
        <span class="text-white/40 text-xs">•</span>
        <span class="text-[11px] font-medium tracking-wide text-white/60">Card 3 of 5</span>
      </div>
      <button type="button" aria-label="Close" class="w-8 h-8 flex items-center justify-center text-white/80 active:opacity-60 transition-opacity">
        <svg class="w-5 h-5 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content: Centered Question & Translucent Flat Options -->
  <main class="flex-1 flex flex-col justify-center px-7 z-10 my-auto py-4">
    <!-- Question Text inspired by WNRS: centered, bold, wide margins, clean typography -->
    <div class="text-center mb-8">
      <p class="text-[11px] tracking-widest font-semibold uppercase text-white/70 mb-3">Question</p>
      <h1 class="text-[26px] leading-[1.3] font-bold text-white tracking-tight px-1">
        What was the first thing you noticed about me?
      </h1>
    </div>

    <!-- Four flat translucent pill options (no borders, no shadows) -->
    <div class="space-y-3 w-full max-w-sm mx-auto">
      <button type="button" class="w-full py-4 px-6 rounded-full bg-white/[0.12] active:bg-white/[0.22] transition-colors text-center text-[15px] font-semibold text-white tracking-normal">
        Your warm smile and eyes
      </button>
      <button type="button" class="w-full py-4 px-6 rounded-full bg-white/[0.12] active:bg-white/[0.22] transition-colors text-center text-[15px] font-semibold text-white tracking-normal">
        Your distinct, effortless sense of style
      </button>
      <button type="button" class="w-full py-4 px-6 rounded-full bg-white/[0.12] active:bg-white/[0.22] transition-colors text-center text-[15px] font-semibold text-white tracking-normal">
        The calm confidence in your voice
      </button>
      <button type="button" class="w-full py-4 px-6 rounded-full bg-white/[0.12] active:bg-white/[0.22] transition-colors text-center text-[15px] font-semibold text-white tracking-normal">
        How attentive and present you were
      </button>
    </div>
  </main>

  <!-- Bottom Bar: Two thin white monochrome stroke icons, no emojis -->
  <footer class="pb-8 pt-4 px-8 z-20 flex items-center justify-between max-w-xs mx-auto w-full">
    <!-- Heart icon (thin stroke) -->
    <button type="button" aria-label="Save or like" class="w-12 h-12 flex items-center justify-center text-white/90 active:text-white transition-colors">
      <svg class="w-6 h-6 stroke-[1.25]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"></path>
      </svg>
    </button>

    <!-- Chat / whisper icon (thin stroke) -->
    <button type="button" aria-label="Reply or discuss" class="w-12 h-12 flex items-center justify-center text-white/90 active:text-white transition-colors">
      <svg class="w-6 h-6 stroke-[1.25]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.444 3 12c0 2.104.859 4.023 2.273 5.48.337.348.47.839.351 1.309l-.66 2.641a.75.75 0 00.93.91l2.951-1.032a1.5 1.5 0 011.026.064c1.01.455 2.13.728 3.129.728z"></path>
      </svg>
    </button>
  </footer>

</body>
</html>
